global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tillora-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: tillora-monitoring
      password_file: /run/secrets/management_password
    static_configs:
      - targets:
          - tillora-api:8081
